spring.application.name=phase0-lending
server.port=8084

spring.datasource.url=jdbc:h2:mem:lending;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Affordability pre-check defaults. All three values are optional and may be
# overridden through relaxed binding or environment variables.
lending.affordability.default-annual-interest-rate=12.50
lending.affordability.preferred-max-dti=40.00
lending.affordability.hard-max-dti=50.00
